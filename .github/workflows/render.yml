name: Render profile card

on:
  push:
    branches: [main]
    paths-ignore: ["*.svg"]
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Push as the token's owner (repo admin) so the commit bypasses the
          # PR-required ruleset on main. SVG-only pushes don't retrigger this.
          token: ${{ secrets.ACCESS_TOKEN || github.token }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Render SVGs
        env:
          # Fine-grained PAT (read-only: metadata, contents) so private repos
          # and contributions count. Falls back to the workflow token.
          ACCESS_TOKEN: ${{ secrets.ACCESS_TOKEN || github.token }}
        run: node src/main.ts
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dark.svg light.svg
          git diff --cached --quiet || git commit -m "chore: render profile card"
          git push
